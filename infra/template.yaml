AWSTemplateFormatVersion: '2010-09-09'
Description: CarbonChain backend - HTTP API, Lambda, DynamoDB, S3 evidence vault, Bedrock access

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket holding the Lambda zip (created by deploy.ps1)
  CodeKey:
    Type: String
    Description: S3 key of the Lambda zip
  BedrockModelId:
    Type: String
    Default: ''
    Description: Bedrock model ID or inference-profile ID (leave empty to use built-in fallback responses)

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CarbonChain_Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: wallet_address, AttributeType: S }
      KeySchema:
        - { AttributeName: wallet_address, KeyType: HASH }

  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CarbonChain_Projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: project_id, AttributeType: S }
      KeySchema:
        - { AttributeName: project_id, KeyType: HASH }

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CarbonChain_Transactions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: tx_id, AttributeType: S }
      KeySchema:
        - { AttributeName: tx_id, KeyType: HASH }

  EvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub carbonchain-evidence-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CarbonChainAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt ProjectsTable.Arn
                  - !GetAtt TransactionsTable.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub ${EvidenceBucket.Arn}/*
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: '*'

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CarbonChainApi
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Timeout: 30
      MemorySize: 512
      Role: !GetAtt LambdaRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          PROJECTS_TABLE: !Ref ProjectsTable
          USERS_TABLE: !Ref UsersTable
          TRANSACTIONS_TABLE: !Ref TransactionsTable
          S3_BUCKET_NAME: !Ref EvidenceBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: CarbonChainApi
      ProtocolType: HTTP

  HttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${HttpIntegration}

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  EvidenceBucketName:
    Value: !Ref EvidenceBucket
